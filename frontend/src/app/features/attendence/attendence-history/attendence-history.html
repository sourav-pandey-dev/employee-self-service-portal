<section class="panel">
  <div class="heading">
    <div>
      <h1>Attendance History</h1>
      <p>Showing today's attendance status.</p>
    </div>
    <span class="today">{{ today | date: 'mediumDate' }}</span>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of todaysRecords()">
        <td>{{ item.date | date: 'mediumDate' }}</td>
        <td><app-status-badge [status]="item.status | attendanceStatus"></app-status-badge></td>
      </tr>
    </tbody>
  </table>
</section>
