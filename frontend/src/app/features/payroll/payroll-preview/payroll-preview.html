<section class="panel"><h1>Payroll Preview</h1><table><tr><th>Employee</th><th>Month</th><th>Gross</th><th>Deduction</th><th>Net</th></tr><tr *ngFor="let item of payroll.payslips()"><td>{{ item.employeeName }}</td><td>{{ item.month }}</td><td>{{ item.basic + item.allowance + item.adjustment | currencyFormat }}</td><td>{{ item.deduction | currencyFormat }}</td><td>{{ item.netPay | currencyFormat }}</td></tr></table></section>
