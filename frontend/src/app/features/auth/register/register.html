<section class="wide-card">
  <h1>Employee Sign Up</h1>
  <form [formGroup]="form" (ngSubmit)="register()" class="grid-form">
    <label>Name <input formControlName="name"></label>
    <label>Email <input type="email" formControlName="email"></label>
    <label>Password <input type="password" formControlName="password"></label>
    <label>Department <input formControlName="department"></label>
    <label>Designation <input formControlName="designation"></label>
    <label>Phone <input appInputMask formControlName="phone"></label>
    <label>Join Date <input type="date" formControlName="joinDate"></label>
    <small>{{ message }}</small>
    <button type="submit" [disabled]="loading">{{ loading ? 'Creating account...' : 'Sign Up' }}</button>
    <a routerLink="/login">Back to login</a>
  </form>
</section>
