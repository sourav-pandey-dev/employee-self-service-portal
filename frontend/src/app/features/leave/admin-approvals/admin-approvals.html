<section class="panel"><h1>Leave Approvals</h1><table><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Status</th><th>Action</th></tr><tr *ngFor="let leave of pending$ | async" [appHighlightRow]="leave.status === 'Pending'"><td>{{ leave.employeeName }}</td><td>{{ leave.type }}</td><td>{{ leave.fromDate }} to {{ leave.toDate }}</td><td><app-status-badge [status]="leave.status"></app-status-badge></td><td><button (click)="update(leave.id, 'Approved')">Approve</button><button class="danger" (click)="update(leave.id, 'Rejected')">Reject</button><button class="muted" (click)="update(leave.id, 'Correction')">Return</button></td></tr></table></section>
