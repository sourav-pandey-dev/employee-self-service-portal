<section class="panel"><h1>Attendance Correction</h1><form [formGroup]="form" (ngSubmit)="submit()" class="form-card"><label>Date <input type="date" formControlName="date"></label><label>Requested Status <select formControlName="requestedStatus"><option>Present</option><option>Half Day</option><option>Absent</option></select></label><label>Remark <textarea formControlName="remark"></textarea></label><small *ngIf="form.get('remark')?.touched && form.get('remark')?.errors?.['attendanceRemark']">Remark must be at least 10 characters.</small><button type="submit">Send Request</button></form></section>
