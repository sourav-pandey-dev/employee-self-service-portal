<section class="two-column">
  <div class="panel">
    <h1>{{ editMode ? 'Modify Leave Request' : 'Apply Leave' }}</h1>
    <form [formGroup]="form" (ngSubmit)="apply()" class="form-card">
      <label>
        Leave Type
        <select formControlName="type">
          <option>Casual</option>
          <option>Sick</option>
          <option>Earned</option>
        </select>
      </label>
      <label>From Date <input type="date" formControlName="fromDate"></label>
      <label>To Date <input type="date" formControlName="toDate"></label>
      <label>Reason <textarea formControlName="reason"></textarea></label>
      <small *ngIf="form.errors?.['dateOverlap']">To date should be after from date.</small>
      <small *ngIf="form.errors?.['leaveBalance']">Leave days exceed balance.</small>
      <div style="display: flex; gap: 10px;">
        <button type="submit">{{ editMode ? 'Update Leave' : 'Submit Leave' }}</button>
        <button type="button" class="muted" *ngIf="editMode" (click)="cancelEdit()">Cancel Edit</button>
      </div>
    </form>
  </div>
  <div class="panel">
    <h2>My Requests</h2>
    <table>
      <tr>
        <th>Type</th>
        <th>Dates</th>
        <th>Days</th>
        <th>Status</th>
      </tr>
      <tr *ngFor="let leave of leaves$ | async">
        <td>{{ leave.type }}</td>
        <td>{{ leave.fromDate | date:'mediumDate' }} to {{ leave.toDate | date:'mediumDate' }}</td>
        <td>{{ leave.days }}</td>
        <td><app-status-badge [status]="leave.status"></app-status-badge></td>
      </tr>
    </table>
  </div>
</section>
