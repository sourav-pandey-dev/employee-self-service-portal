<section class="panel">
    <h1>Notification Preferences</h1>
    <form #prefForm="ngForm" (ngSubmit)="save()" class="form-card"><label><input type="checkbox" name="emailAlerts"
                [(ngModel)]="preferences.emailAlerts"> Email alerts</label><label><input type="checkbox"
                name="smsAlerts" [(ngModel)]="preferences.smsAlerts"> SMS alerts</label><label>Communication Mode
            <select name="communicationMode" [(ngModel)]="preferences.communicationMode">
                <option>Email</option>
                <option>SMS</option>
                <option>Both</option>
            </select></label><button type="submit">Save Preferences</button>
        <p *ngIf="saved">Preferences saved.</p>
    </form>
</section>
