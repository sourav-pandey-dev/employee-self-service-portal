<section class="panel" *ngIf="payslip as p"><h1>Payslip - {{ p.month }}</h1><p>{{ p.employeeName }} | Generated on {{ p.generatedOn }}</p><table><tr><td>Basic</td><td>{{ p.basic | currencyFormat }}</td></tr><tr><td>Allowance</td><td>{{ p.allowance | currencyFormat }}</td></tr><tr><td>Adjustment</td><td>{{ p.adjustment | currencyFormat }}</td></tr><tr><td>Deduction</td><td>- {{ p.deduction | currencyFormat }}</td></tr><tr class="total"><td>Net Pay</td><td>{{ p.netPay | currencyFormat }}</td></tr></table><button (click)="print()">Print Payslip</button></section>
