<form [formGroup]="form" (ngSubmit)="submit()" class="simple-form">
  <label *ngFor="let field of fields">
    {{ field.label }}
    <ng-container [ngSwitch]="field.type">
      <select *ngSwitchCase="'select'" [formControlName]="field.name">
        <option value="" disabled selected>Select {{ field.label }}</option>
        <option *ngFor="let opt of field.options" [value]="opt.value">{{ opt.label }}</option>
      </select>
      <input *ngSwitchDefault [type]="field.type" [formControlName]="field.name">
    </ng-container>
    <small *ngIf="form.get(field.name)?.touched && form.get(field.name)?.invalid">Required</small>
  </label>
  <button type="submit">Save Payroll Input</button>
</form>
