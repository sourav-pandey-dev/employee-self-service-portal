<section class="two-column"><div class="panel"><h1>Apply Leave</h1><form [formGroup]="form" (ngSubmit)="apply()" class="form-card"><label>Leave Type <select formControlName="type"><option>Casual</option><option>Sick</option><option>Earned</option></select></label><label>From Date <input type="date" formControlName="fromDate"></label><label>To Date <input type="date" formControlName="toDate"></label><label>Reason <textarea formControlName="reason"></textarea></label><small *ngIf="form.errors?.['dateOverlap']">To date should be after from date.</small><small *ngIf="form.errors?.['leaveBalance']">Leave days exceed balance.</small><button type="submit">Submit Leave</button></form></div><div class="panel"><h2>My Requests</h2><table><tr><th>Type</th><th>Days</th><th>Status</th></tr><tr *ngFor="let leave of leaves$ | async"><td>{{ leave.type }}</td><td>{{ leave.days }}</td><td>{{ leave.status }}</td></tr></table></div></section>
