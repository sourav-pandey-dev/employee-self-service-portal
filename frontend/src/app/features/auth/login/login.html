<section class="auth-card">
  <h1>Employee Portal Login</h1>
  <div class="login-options" role="tablist" aria-label="Login type">
    <button type="button" [class.active]="loginType === 'Employee'" (click)="selectLogin('Employee')">Employee Login</button>
    <button type="button" [class.active]="loginType === 'Admin'" (click)="selectLogin('Admin')">Admin Login</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="login()" class="form-card">
    <h2>{{ loginType === 'Admin' ? 'Admin Login' : 'Employee Login' }}</h2>
    <p *ngIf="loginType === 'Admin'">Use the admin account from db.json.</p>
    <label>Email <input type="email" formControlName="email"></label>
    <label>Password <input type="password" formControlName="password"></label>
    <small *ngIf="error">{{ error }}</small>
    <button type="submit" [disabled]="loading">{{ loading ? 'Logging in...' : 'Login' }}</button>
    <a *ngIf="loginType === 'Employee'" routerLink="/register">New employee? Sign up</a>
  </form>
</section>
